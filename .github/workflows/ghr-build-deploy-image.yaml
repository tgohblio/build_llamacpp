# Builds and pushes the Runpod serverless Docker image for llama.cpp.
# Triggered automatically after a successful build workflow, or manually with a run ID.
# Downloads the llama-server binary from the build artifact, bundles it with the handler scripts.
name: Build llama (runpod deployment)

on:
  workflow_run:
    workflows: ["Build llama (Github Runner)", "Build llama (Runpod)"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of the build workflow that produced the llama_apps artifact'
        required: true
      artifact_name:
        description: 'Artifact name (e.g. llama_apps or llama_apps-pr123)'
        required: false
        default: 'llama_apps'

jobs:
  build:
    name: Build runpod serverless deployment image
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Resolve run ID
        id: resolve-run
        run: |
          if [ -n "${{ inputs.run_id }}" ]; then
            echo "run_id=${{ inputs.run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact_name || 'llama_apps' }}
          path: staging
          run-id: ${{ steps.resolve-run.outputs.run_id }}
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Prepare application files
        run: |
          rm -f staging/llama-cli staging/llama-quantize
          cp -r llama_runpod/* staging/

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: llama_runpod/Dockerfile
          push: true
          platforms: linux/amd64
          tags: dockerdl2018/llama-runner:latest
