name: Build llama (Runpod)

on:
  workflow_dispatch:
    inputs:
      cuda_architectures:
        description: CUDA architectures
        required: false
        default: 80;86;89;90;120a
      runpod_image:
        description: Container image for the pod (contains the GH runner + CUDA toolkit)
        required: false
        default: 'dockerdl2018/llama-runner:cuda13'
      pr_number:
        description: 'PR number to build (leave empty for master)'
        required: false
        default: ''

#  push:
#    branches: main
    # only runs when the files below that actually affect the build change
#    paths:
#      - '.github/workflows/build-flow.yaml'
#  pull_request:
    # only runs when the files below that actually affect the build change
#    paths:
#      - '.github/workflows/build-flow.yaml'

# If multiple commits are pushed to a PR in quick succession, only the latest workflow run will execute.
# The previous two runs get cancelled automatically, saving CI resources and reducing feedback time.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CMAKE_CUDA_ARCHITECTURES: ${{ github.event.inputs.cuda_architectures || '80;86;89;90;120a' }}
  RUNPOD_DOCKER_IMAGE: "${{ github.event.inputs.runpod_image || 'dockerdl2018/llama-runner:cuda13' }}"
  RUNPOD_VCPU_COUNT: 8
  RUNPOD_RAM_GB: 16
  RUNPOD_DISK_GB: 20
  RUNPOD_SSH_PORT: 22
  RUNPOD_SSH_ENABLED: false

jobs:
  # -------------------------------------------------------------------------
  # 1) Provision: create the Runpod CPU pod and wait for the runner to register
  # -------------------------------------------------------------------------
  provision:
    name: Provision Runpod CPU pod
    runs-on: ubuntu-24.04
    outputs:
      pod_id: ${{ steps.create.outputs.pod_id }}
    steps:
      - name: Get Registration Token & Create Pod
        id: create
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -euo pipefail
          RUNNER_TOKEN="$(gh api -X POST /repos/${{ github.repository }}/actions/runners/registration-token --jq .token)"
          POD_NAME="gh-runner-${{ github.run_id }}"

          # Env passed to the runner container image. EPHEMERAL makes the
          # runner exit after a single job (clean teardown).
          ENV_JSON="$(jq -n \
            --arg url "https://github.com/${{ github.repository }}" \
            --arg tok "$RUNNER_TOKEN" \
            --arg name "$POD_NAME" \
            '{REPO_URL:$url, RUNNER_TOKEN:$tok, RUNNER_NAME:$name, LABELS:"runpod", EPHEMERAL:"true"}')"

          # REST v2 derives RAM from the selected CPU flavor, so resolve a
          # flavor whose catalog RAM matches the requested vCPU/RAM pair.
          curl --fail-with-body -sS \
            -o cpu-catalog.json \
            'https://api.runpod.io/v2/catalog/cpus' \
            -H "Authorization: Bearer $RUNPOD_API_KEY"
          CPU_ID="$(jq -r \
            --argjson vcpu "$RUNPOD_VCPU_COUNT" \
            --argjson ram "$RUNPOD_RAM_GB" \
            '.cpus[] | select(.vcpu.min <= $vcpu and .vcpu.max >= $vcpu and (.ramGbPerVcpu * $vcpu) == $ram) | .id' \
            cpu-catalog.json | head -n 1)"
          if [ -z "$CPU_ID" ]; then
            echo "No Runpod CPU flavor provides ${RUNPOD_VCPU_COUNT} vCPUs and ${RUNPOD_RAM_GB} GB RAM." >&2
            exit 1
          fi

          REQUEST_JSON="$(jq -n \
            --arg name "$POD_NAME" \
            --arg image "$RUNPOD_DOCKER_IMAGE" \
            --arg cpu_id "$CPU_ID" \
            --argjson env "$ENV_JSON" \
            --argjson vcpu "$RUNPOD_VCPU_COUNT" \
            --argjson disk "$RUNPOD_DISK_GB" \
            --argjson ssh_port "$RUNPOD_SSH_PORT" \
            --argjson ssh_enabled "$RUNPOD_SSH_ENABLED" \
            '{
              name: $name,
              image: $image,
              cpu: {id: $cpu_id, vcpuCount: $vcpu},
              disk: $disk,
              ports: (if $ssh_enabled then [(( $ssh_port | tostring) + "/tcp")] else [] end),
              startSsh: $ssh_enabled,
              env: $env
            }')"

          HTTP_STATUS="$(curl --fail-with-body -sS \
            -o pod-response.json \
            -w '%{http_code}' \
            -X POST 'https://api.runpod.io/v2/pods' \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            -H 'Content-Type: application/json' \
            --data "$REQUEST_JSON")" || {
              cat pod-response.json >&2
              exit 1
            }

          if [ "$HTTP_STATUS" != '201' ]; then
            cat pod-response.json >&2
            exit 1
          fi

          POD_ID="$(jq -r .id pod-response.json)"
          if [ -z "$POD_ID" ] || [ "$POD_ID" = 'null' ]; then
            echo 'Runpod API response did not contain a pod ID.' >&2
            cat pod-response.json >&2
            exit 1
          fi
          echo "pod_id=$POD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for Runner Online
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          NAME="gh-runner-${{ github.run_id }}"
          for i in $(seq 1 60); do
            if ! RUNNERS_JSON="$(gh api \
              "/repos/${{ github.repository }}/actions/runners")"; then
              echo "::error::Unable to query GitHub self-hosted runners." >&2
              exit 1
            fi

            STATUS="$(jq -r --arg name "$NAME" \
              '.runners[] | select(.name == $name) | .status' <<< "$RUNNERS_JSON")"
            STATUS="${STATUS:-not registered}"
            echo "Runner $NAME status: $STATUS (attempt $i/60)"
            if [ "$STATUS" = "online" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::Self-hosted runner did not come online within 10 minutes." >&2
          exit 1

  # -------------------------------------------------------------------------
  # 2) Build: runs ON the Runpod self-hosted runner (CPU pod).
  #    CUDA toolkit is baked into the image, so we only expose it on PATH and
  #    make sure CMake is new enough for CUDA 13.
  # -------------------------------------------------------------------------
  build:
    name: Build llama-server
    needs: provision
    runs-on: [self-hosted, runpod]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: ggml-org/llama.cpp
          ref: master
          path: llama_repo

      - name: Checkout PR
        if: ${{ github.event.inputs.pr_number != '' }}
        run: |
          cd llama_repo
          git fetch origin pull/${{ github.event.inputs.pr_number }}/head:pr-${{ github.event.inputs.pr_number }}
          git switch pr-${{ github.event.inputs.pr_number }}

      - name: Setup Ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: cuda13-ubuntu-${{ github.run_id }}
          evict-old-files: 1d

      - name: Build llama.cpp
        run: |
          cd llama_repo
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES="${{ env.CMAKE_CUDA_ARCHITECTURES }}" \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_COMMON=ON \
            -DLLAMA_BUILD_TOOLS=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DCMAKE_EXE_LINKER_FLAGS=-Wl,--allow-shlib-undefined
          cmake --build build -j"$(nproc)"

          # Strip debug symbols directly in build output directory
          strip build/bin/llama-server build/bin/llama-cli build/bin/llama-quantize || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: llama_apps${{ github.event.inputs.pr_number && format('-pr{0}', github.event.inputs.pr_number) || '' }}
          if-no-files-found: error
          path: |
            llama_repo/build/bin/llama-server
            llama_repo/build/bin/llama-cli
            llama_repo/build/bin/llama-quantize

  # -------------------------------------------------------------------------
  # 3) Teardown the pod
  # -------------------------------------------------------------------------
  teardown-pod:
    name: Terminate Runpod Pod
    needs: [provision, build]
    if: ${{ always() && needs.provision.outputs.pod_id != '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Terminate Pod
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -euo pipefail
          HTTP_STATUS="$(curl --fail-with-body -sS \
            -o pod-delete-response.json \
            -w '%{http_code}' \
            -X DELETE "https://api.runpod.io/v2/pods/${{ needs.provision.outputs.pod_id }}" \
            -H "Authorization: Bearer $RUNPOD_API_KEY")" || {
              cat pod-delete-response.json >&2
              exit 1
            }

          if [ "$HTTP_STATUS" != '204' ]; then
            cat pod-delete-response.json >&2
            exit 1
          fi
