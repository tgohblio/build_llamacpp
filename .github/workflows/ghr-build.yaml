name: Build llama (Github Runner)

on:
  workflow_dispatch:
    inputs:
      cuda_architectures:
        description: CUDA architectures
        required: false
        default: 80;86;89;90;120a
      container_image:
        description: Container image (CUDA toolkit + build tools)
        required: false
        default: 'nvidia/cuda:13.0.2-cudnn-devel-ubuntu24.04'
      pr_number:
        description: 'PR number to build (leave empty for master)'
        required: false
        default: ''

  push:
    branches: main
    paths:
      - '.github/workflows/ghr-build.yaml'
  pull_request:
    paths:
      - '.github/workflows/ghr-build.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CMAKE_CUDA_ARCHITECTURES: ${{ github.event.inputs.cuda_architectures || '80;86;89;90;120a' }}

jobs:
  build:
    name: Build llama-server
    runs-on: ubuntu-24.04
    container:
      image: ${{ github.event.inputs.container_image || 'nvidia/cuda:13.0.2-cudnn-devel-ubuntu24.04' }}

    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/usr/local/cuda/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            git \
            curl \
            ca-certificates \
            python3-pip \
            libssl-dev \
            libzstd-dev \
            libbz2-dev \
            liblzma-dev \
            libcurl4-openssl-dev \
            ccache \
            file

      - name: Checkout llama.cpp repository
        uses: actions/checkout@v7
        with:
          repository: ggml-org/llama.cpp
          ref: master
          path: llama_repo

      - name: Checkout PR
        if: ${{ github.event.inputs.pr_number != '' }}
        run: |
          cd llama_repo
          git fetch origin pull/${{ github.event.inputs.pr_number }}/head:pr-${{ github.event.inputs.pr_number }}
          git switch pr-${{ github.event.inputs.pr_number }}

      - name: Setup Ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: cuda13-ubuntu-${{ github.run_id }}
          evict-old-files: 1d

      - name: Build llama.cpp
        run: |
          cd llama_repo
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES="${{ env.CMAKE_CUDA_ARCHITECTURES }}" \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_COMMON=ON \
            -DLLAMA_BUILD_TOOLS=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DCMAKE_EXE_LINKER_FLAGS=-Wl,--allow-shlib-undefined
          cmake --build build -j"$(nproc)"

          strip build/bin/llama-server build/bin/llama-cli build/bin/llama-quantize || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: llama_apps${{ github.event.inputs.pr_number && format('-pr{0}', github.event.inputs.pr_number) || '' }}
          if-no-files-found: error
          path: |
            llama_repo/build/bin/llama-server
            llama_repo/build/bin/llama-cli
            llama_repo/build/bin/llama-quantize
